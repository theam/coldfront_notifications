<!-- MODAL: Recipient Preview -->
<div class="modal fade" id="recipModal" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="fas fa-users mr-2"></i>Recipient Preview</h5>
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </div>
      <div class="modal-body p-0">
        <div class="recip-topbar">
          <span>
            <i class="fas fa-info-circle mr-1"></i>
            {{ info_text }}
          </span>
          <input type="text" id="recipSearch" class="form-control form-control-sm recip-search"
                 placeholder="Search name, email, project&hellip;">
        </div>
        <!-- Fixed-height scrollable table area -->
        <div class="recip-table-wrap">
          <table class="table table-sm mb-0">
            <thead class="thead-light">
              <tr>
                {% if show_dedupe %}<th style="width:40px;">Include</th>{% endif %}
                <th>Name</th><th>Email</th><th>Role</th><th>Project</th><th>Allocation</th>
              </tr>
            </thead>
            {% if show_dedupe %}
            <tbody id="dedupeAllRow" style="display:none;">
              <tr style="background:#f8f9fa;">
                <td style="text-align:center;">
                  <input type="checkbox" id="dedupeAllCb" title="Keep only PI row for all">
                </td>
                <td colspan="5" style="font-size:.78rem;color:#6c757d;">
                  <strong>Dedupe all</strong> &mdash; keep only PI/first row per user
                </td>
              </tr>
            </tbody>
            {% endif %}
            <tbody id="recipRows">
              <tr><td colspan="{% if show_dedupe %}6{% else %}5{% endif %}" class="text-center text-muted py-3">
                <i class="fas fa-spinner fa-spin mr-1"></i>Loading&hellip;
              </td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <!-- Pagination bar — always visible, outside scroll area -->
      <div class="recip-toolbar">
        <div class="recip-toolbar-left">
          <span id="recipModalCount"></span>
          <span class="badge badge-info ml-2" id="recipModalScope" style="display:none;"></span>
        </div>
        <div class="recip-toolbar-center" id="recipPagination">
          <button type="button" class="btn btn-outline-secondary btn-sm" id="recipFirstBtn" disabled title="First page">
            <i class="fas fa-angle-double-left"></i>
          </button>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="recipPrevBtn" disabled>
            <i class="fas fa-chevron-left"></i>
          </button>
          <span class="recip-page-info" id="recipPageInfo">Page 1 of 1</span>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="recipNextBtn" disabled>
            <i class="fas fa-chevron-right"></i>
          </button>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="recipLastBtn" disabled title="Last page">
            <i class="fas fa-angle-double-right"></i>
          </button>
        </div>
        <div class="recip-toolbar-right">
          <label class="recip-page-size-label">
            Show
            <select id="recipPageSize" class="form-control form-control-sm recip-page-size-select">
              <option value="10" selected>10</option>
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            per page
          </label>
          <button type="button" class="btn btn-secondary btn-sm ml-3" data-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
</div>
