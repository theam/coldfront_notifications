<div class="col-md-3">
  <div class="card mb-3" style="border-top:3px solid {{ color }};">
    <div class="card-body">
      <div style="font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#6c757d;margin-bottom:6px;">{{ label }}</div>
      <div style="font-size:2rem;font-weight:700;font-family:monospace;{% if value_color %}color:{{ value_color }};{% else %}color:#212529;{% endif %}">{{ value }}</div>
    </div>
  </div>
</div>
